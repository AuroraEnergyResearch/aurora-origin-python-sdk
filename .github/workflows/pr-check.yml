name: Verify compatibility wrapper

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build wheel and source distribution
        run: |
          python -m pip install build
          python -m build
      - name: Verify artifacts and resolver boundaries
        run: python tests/verify_wrapper.py
      - name: Verify installation from PyPI
        run: |
          python -m venv clean-environment
          clean-environment/bin/pip install dist/*.whl
          clean-environment/bin/python -W error::FutureWarning -c "from importlib.metadata import packages_distributions, version; import origin_sdk; from origin_sdk.OriginSession import OriginSession; from origin_sdk.service.Project import Project; from origin_sdk.service.Scenario import Scenario; replacement_version = tuple(map(int, version('auroraer-origin-sdk').split('.')[:3])); assert version('aurora-origin-sdk') == '0.32.0'; assert (0, 31, 0) <= replacement_version < (1, 0, 0); assert 'auroraer_origin_sdk' in packages_distributions()['origin_sdk']; OriginSession({'token': 'wrapper-test-token'})"
      - uses: actions/upload-artifact@v4
        if: matrix.python-version == '3.14'
        with:
          name: compatibility-wrapper-distributions
          path: dist/
