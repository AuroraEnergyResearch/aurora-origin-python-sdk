[project]
name = "aurora-origin-sdk"
version = "0.32.0"
description = "Compatibility wrapper for auroraer-origin-sdk"
authors = [
  { name = "Aurora Development", email = "aurora_development@auroraer.com" },
]
readme = "README.md"
keywords = [
  "aurora",
  "energy",
  "research",
  "auroraenergyresearch",
  "aer",
  "origin",
  "sdk",
]
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["auroraer-origin-sdk>=0.31.0,<1"]
requires-python = ">=3.9,<3.15"

[project.optional-dependencies]
notebooks = ["auroraer-origin-sdk[notebooks]>=0.31.0,<1"]

[project.urls]
repository = "https://github.com/AuroraEnergyResearch/aurora-origin-python-sdk"

[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools"]

[tool.setuptools]
packages = []
